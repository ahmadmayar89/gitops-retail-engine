# Frontend - no rewrite needed
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-frontend
  namespace: retail
spec:
  rules:
  - host: retail.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

---
# Backend API - rewrite to preserve /api prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-api
  namespace: retail
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/$1
spec:
  rules:
  - host: retail.local
    http:
      paths:
      - path: /api/(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-service
            port:
              number: 5000

---
# Health check - no rewrite needed
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-health
  namespace: retail
spec:
  rules:
  - host: retail.local
    http:
      paths:
      - path: /health
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-service
            port:
              number: 5000

---
# Root API - no rewrite needed
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-root
  namespace: retail
spec:
  rules:
  - host: retail.local
    http:
      paths:
      - path: /api
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-service
            port:
              number: 5000
